<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
    }

    .calculator {
      width: 320px;
      background: #020617;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .display {
      width: 100%;
      height: 70px;
      background: #020617;
      color: #e5e7eb;
      font-size: 2rem;
      text-align: right;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      overflow-x: auto;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border-radius: 12px;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      background: #1e293b;
      color: #f8fafc;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #334155;
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background: #2563eb;
    }

    .operator:hover {
      background: #1d4ed8;
    }

    .equal {
      grid-column: span 2;
      background: #16a34a;
    }

    .equal:hover {
      background: #15803d;
    }

    .clear {
      background: #dc2626;
    }

    .clear:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div id="display" class="display">0</div>

    <div class="buttons">
      <button class="clear">C</button>
      <button>/</button>
      <button>*</button>
      <button class="operator">-</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator">+</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>.</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="equal">=</button>

      <button>0</button>
      <button>%</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    const buttons = document.querySelectorAll("button");

    let expression = "";

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        const value = button.innerText;

        if (value === "C") {
          expression = "";
          display.innerText = "0";
          return;
        }

        if (value === "=") {
          try {
            expression = eval(expression).toString();
            display.innerText = expression;
          } catch {
            display.innerText = "Error";
            expression = "";
          }
          return;
        }

        expression += value;
        display.innerText = expression;
      });
    });
  </script>
</body>
</html>
